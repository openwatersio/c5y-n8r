name: Spike checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  merge-inputs:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.refs.outputs.base }}
      head: ${{ steps.refs.outputs.head }}
      merge: ${{ steps.refs.outputs.merge }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Record immutable merge inputs
        id: refs
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node --input-type=module <<'NODE'
          import {execFileSync} from 'node:child_process';
          import {appendFileSync,writeFileSync} from 'node:fs';
          const git=args=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const mergeSha=git(['rev-parse','HEAD']);
          const parents=git(['show','--no-patch','--format=%P',mergeSha]).split(/\s+/);
          if (mergeSha!==process.env.GITHUB_SHA || parents.length!==2 || parents[1]!==process.env.PR_HEAD_SHA) throw Error('Unexpected merge inputs');
          const [baseSha,headSha]=parents;
          appendFileSync(process.env.GITHUB_OUTPUT,`base=${baseSha}\nhead=${headSha}\nmerge=${mergeSha}\n`);
          writeFileSync('reader-binding.json',JSON.stringify({schemaVersion:1,mergeSha,baseSha,headSha})+'\n');
          NODE
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: reader-binding
          path: reader-binding.json
          if-no-files-found: error
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm run build
      - run: git diff --exit-code -- data/
      - name: Authenticate pinned Slackwater geocoder inventory
        run: node scripts/check-geocoder-inventory.mjs
  wikidata-evidence:
    needs: merge-inputs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.merge-inputs.outputs.base }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.merge-inputs.outputs.merge }}
          path: proposed
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: trusted
      - name: Find evidence for proposed assertions
        run: npm run evidence -- --corpus ../proposed --base . --output ../evidence-report
        working-directory: trusted
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: wikidata-evidence
          path: evidence-report/

  reader-observations:
    needs: merge-inputs
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.merge-inputs.outputs.base }}
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.merge-inputs.outputs.merge }}
          path: proposed
          persist-credentials: false
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: proposed
      - run: npm run build:reader
        working-directory: proposed
      - run: npm ci --ignore-scripts
        working-directory: harness
      - name: Record untrusted reader observations
        run: node --import tsx scripts/observe-reader.ts --reader ../proposed/dist/index.js --corpus ../proposed --cases sources/accepted-inputs.json --output ../reader-results.json
        working-directory: harness
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: reader-observations
          path: reader-results.json
          if-no-files-found: error

  reader-compatibility:
    needs: [merge-inputs, reader-observations]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require successful observation producer
        env:
          PRODUCER_RESULT: ${{ needs.reader-observations.result }}
        run: test "$PRODUCER_RESULT" = success
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.merge-inputs.outputs.base }}
          path: trusted
          persist-credentials: false
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.merge-inputs.outputs.merge }}
          path: proposed
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: reader-observations
          path: observations
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
        working-directory: trusted
      - name: Judge observations without executing proposed code
        run: npm run evidence -- --corpus ../proposed --base . --reader-results ../observations/reader-results.json --output ../compatibility-report
        working-directory: trusted
      - name: Require executed compatibility comparisons
        run: node -e "const r=require('./compatibility-report/report.json'); if(r.mode !== 'reader-compatibility' || r.passed !== true || !(r.checkedLookups > 0)) throw Error('Trusted checker did not approve reader observations')"
      - uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: reader-compatibility
          path: compatibility-report/
