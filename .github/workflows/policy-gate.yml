name: Country policy controller
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [Spike checks]
    types: [completed]
permissions:
  statuses: write
  actions: read
  contents: read
  pull-requests: read
concurrency:
  group: country-policy-controller
  cancel-in-progress: false
jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/github-script@v7
        with:
          script: |
            const { gate } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/policy-gate.mjs`);
            await gate({github, context});
